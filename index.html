<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos entediados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="links">
        <div class="card_link" id="minecraft">
            <div id="icon"></div>
            <div class="info">
                <div class="nome">Minecraft</div>
                <div class="dscr">Diversas versões de Minecraft inclusive com mods e suporte para jogar online local ou em servidores.</div>
                <div class="ctgr">
                    <div class="jogo"></div>
                </div>
            </div>
        </div>
        <div class="card_link" id="gtavc">
            <div id="icon"></div>
            <div class="info">
                <div class="nome">GTA Vice City</div>
                <div class="dscr"></div>
                <div class="ctgr">
                    <div class="jogo"></div>
                </div>
            </div>
        </div>
        <div class="card_link" id="rise_of_the_half_moon">
            <div id="icon"></div>
            <div id="info">
                <div class="nome">Rise of the Half Moon</div>
                <div class="dscr">Jogo de cartas inspirado nas fases da Lua, onde você deve criar combinações e sequências para marcar mais pontos contra a Lua.</div>
                <div class="ctgr">
                    <div class="jogo"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
