<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alunos Entediados</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fundo do jogo selecionado -->
    <div class="background"></div>

    <main class="launcher">

        <!-- Ícone do jogo selecionado -->
        <div class="game-icon"></div>

        <!-- Lista de jogos -->
        <div class="game-list-container">

            <div class="game-list">

                <div class="game selected" data-game="minecraft">
                    Minecraft
                </div>
                <div class="game" data-game="gtavc">
                    Grand Theft Auto: Vice City
                </div>
                <div class="game" data-game="messenger">
                    Messenger
                </div>
                <div class="game" data-game="skullhotel">
                    Skull Hotel
                </div>
                <div class="game" data-game="geoguessr">
                    Geoguessr
                </div>
                <div class="game" data-game="sfex2">
                    Street Fighter EX2
                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
